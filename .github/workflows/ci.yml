name: CI

# Pull request and push pipeline for the FigTether workspace.
#
# Job map (mirrors the CI gate list in docs/01-agile/01-sdlc-process.md):
#   rust-fmt          CI-01  cargo fmt --all --check
#   rust-clippy       CI-02  cargo clippy --workspace --all-targets -- -D warnings
#   rust-test         CI-03  cargo test --workspace
#   schema-contract   CI-04  generated schemas must equal the committed ones
#   plugin-typescript CI-05/06/07  required typecheck, lint, build and tests
#   docs-format       CI-13  npm run format:check plus the em dash scan
#   dependency-audit  CI-09  cargo deny plus cargo audit
#   sbom              CI-10  CycloneDX SBOM artifact
#   license-check     license files plus the dependency license policy
#   workflow-lint     actionlint validates every Actions workflow
#   required          stable, fail-closed status for branch protection

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege by default: every job only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  rust-fmt:
    name: rust fmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rustfmt
          cache: true
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

  rust-clippy:
    name: rust clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: clippy
          cache: true
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rust-test:
    name: rust test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-15]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: true
      - name: cargo test --workspace --locked
        run: |
          mkdir -p artifacts
          {
            printf 'commit=%s\nrunner=%s/%s\n' "$GITHUB_SHA" "$RUNNER_OS" "$RUNNER_ARCH"
            rustc --version
            cargo --version
          } > artifacts/rust-environment.txt
          cargo test --workspace --locked 2>&1 | tee artifacts/rust-tests.log
      - name: Retain Rust test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-tests-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

  schema-contract:
    name: schema contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: true
      - name: Check the committed schemas against the generated ones
        run: sh scripts/schema-check.sh

  plugin-typescript:
    name: plugin typescript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require the plugin workspace and lockfile
        run: |
          test -s plugins/figma/package.json
          test -s plugins/figma/package-lock.json
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugins/figma/package-lock.json
      - name: Install plugin dependencies
        run: npm ci
        working-directory: plugins/figma
      - name: Typecheck
        run: npm run build:types && npm run typecheck
        working-directory: plugins/figma
      - name: Lint
        run: npm run lint:all
        working-directory: plugins/figma
      - name: Build
        run: npm run build
        working-directory: plugins/figma
      - name: Test
        run: npm test -- --reporter=default --reporter=junit --outputFile=../../artifacts/plugin-tests.xml
        working-directory: plugins/figma
      - name: Require the test report
        run: test -s artifacts/plugin-tests.xml
      - name: Retain plugin test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-tests
          path: artifacts/plugin-tests.xml
          if-no-files-found: warn
          retention-days: 30

  docs-format:
    name: docs format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install documentation tooling
        run: npm ci
      - name: Prettier check
        run: npm run format:check
      - name: Public documentation, links, and generated visuals
        run: npm run public:test && npm run ci:test && npm run design:test && npm run public:check
      - name: Em dash scan
        run: sh scripts/scan-em-dash.sh

  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: true
      - name: Install the audit tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - name: cargo deny check
        run: cargo deny check
      - name: cargo audit
        run: cargo audit
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install documentation tooling
        run: npm ci
      - name: Frontend lockfile audit
        run: npm audit --audit-level=high
      - name: Plugin dependency audit (including dev tooling)
        run: npm --prefix plugins/figma audit --audit-level=high

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: true
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-cyclonedx@0.5.9
      - name: Generate the CycloneDX SBOM
        run: |
          mkdir -p artifacts/sbom
          cargo cyclonedx --all-features --format json --license-accept-named "MIT/Apache-2.0"
          find crates -name '*.cdx.json' -exec cp {} artifacts/sbom/ \;
          ls -l artifacts/sbom
      - name: Upload the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: artifacts/sbom/
          if-no-files-found: error
          retention-days: 30

  license-check:
    name: license check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: true
      - name: Install cargo-deny
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-deny@0.20.2
      - name: Verify the license files
        run: |
          set -euo pipefail
          for file in LICENSE LICENSE-MIT LICENSE-APACHE NOTICE; do
            if [ ! -s "$file" ]; then
              echo "missing or empty: $file" >&2
              exit 1
            fi
          done
          grep -q "MIT OR Apache-2.0" LICENSE
          grep -q "SPDX-License-Identifier: MIT OR Apache-2.0" LICENSE
          grep -q "Apache License" LICENSE-APACHE
          grep -q "MIT License" LICENSE-MIT
      - name: Dependency license policy
        run: cargo deny check licenses
      - name: Workspace license metadata
        run: |
          set -euo pipefail
          if ! grep -q 'license = "MIT OR Apache-2.0"' Cargo.toml; then
            echo "the workspace license expression drifted from MIT OR Apache-2.0" >&2
            exit 1
          fi

  secret-scan:
    name: secret scan (history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout all history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.3
      - name: Scan reachable history without printing credentials
        run: '"$(go env GOPATH)/bin/gitleaks" git --log-opts="--all" --config .gitleaks.toml --redact --no-banner .'

  workflow-lint:
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned actionlint
        env:
          GOBIN: ${{ runner.temp }}/actionlint-bin
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.11
      - name: Validate workflow syntax, expressions and embedded shell
        run: '"$RUNNER_TEMP/actionlint-bin/actionlint" -color'

  required:
    name: CI required
    if: always()
    needs:
      - rust-fmt
      - rust-clippy
      - rust-test
      - schema-contract
      - plugin-typescript
      - docs-format
      - dependency-audit
      - sbom
      - license-check
      - secret-scan
      - workflow-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Require every prerequisite to succeed
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-gate.mjs

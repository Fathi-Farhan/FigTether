<title id="title">Inside the Rust core.</title><desc id="desc">One offline synthetic Rust diagnostic on AMD Ryzen 5 4500. Directly labeled p50 and p95 bars in microseconds, all using the same zero-based linear scale. Independent operations, not an end-to-end pipeline. Figma, network and model inference not measured. One run without confidence intervals. Original source and hashes are linked in the accompanying Markdown.</desc>

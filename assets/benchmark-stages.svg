<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
<title id="title">Offline Rust stage diagnostic</title><desc id="desc">A separate offline synthetic Rust diagnostic. The zero-based linear axis is in microseconds. Bars show p50 and p95; Figma, network, and model inference are not measured. One run, no confidence interval.</desc>
<style>text{fill:#111111;font-family:Arial,Helvetica,sans-serif;font-size:16px}.heading{font-family:Gelasio,Georgia,serif;font-size:36px;font-weight:400;letter-spacing:-.6px}.subhead{font-family:Gelasio,Georgia,serif;font-size:24px}.label{font-size:18px;font-weight:600}.body{font-size:16px}.small{font-size:14px;fill:#525252}.meta{font-family:"Ubuntu Mono",Consolas,monospace;font-size:13px;letter-spacing:.5px}.code{font-family:"Ubuntu Mono",Consolas,monospace;font-size:19px}.value{font-family:Consolas,monospace;font-size:16px}.warn{fill:#9a4b00;font-size:14px}</style>
<rect width="1100" height="600" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M 0 0 L 7 3.5 L 0 7" fill="#111111"/></marker></defs>

<text x="40" y="40" class="meta" >04 / FIGTETHER - OFFLINE DIAGNOSTIC</text><path d="M 40 58 L 1060 58" stroke="#d4d4d4" /><text x="40" y="106" class="heading" >Where the Rust core spends time.</text><text x="40" y="138" class="small" >2,000 samples / stage · AMD Ryzen 5 4500 · commit e9e23b0</text>
<rect x="780" y="159" width="20" height="12" fill="#8a8a8a"/><text x="810" y="170" class="small" >p50</text>
<rect x="880" y="159" width="20" height="12" fill="#111111"/><text x="910" y="170" class="small" >p95</text>
<path d="M 330 184 V 478" stroke="#d4d4d4"/><text x="330" y="501" class="meta" text-anchor="middle">0</text><path d="M 477.5 184 V 478" stroke="#d4d4d4"/><text x="477.5" y="501" class="meta" text-anchor="middle">50</text><path d="M 625 184 V 478" stroke="#d4d4d4"/><text x="625" y="501" class="meta" text-anchor="middle">100</text><path d="M 772.5 184 V 478" stroke="#d4d4d4"/><text x="772.5" y="501" class="meta" text-anchor="middle">150</text><path d="M 920 184 V 478" stroke="#d4d4d4"/><text x="920" y="501" class="meta" text-anchor="middle">200</text><text x="40" y="225" class="label" >Queue admission</text><rect x="330" y="206" width="5.6049999999999995" height="13" fill="#8a8a8a"/><text x="343.605" y="218" class="small" >1.9</text><rect x="330" y="227" width="8.555" height="13" fill="#111111"/><text x="346.555" y="239" class="small" >2.9</text><text x="40" y="296" class="label" >Frame encode / decode</text><rect x="330" y="277" width="24.78" height="13" fill="#8a8a8a"/><text x="362.78" y="289" class="small" >8.4</text><rect x="330" y="298" width="32.45" height="13" fill="#111111"/><text x="370.45" y="310" class="small" >11.0</text><text x="40" y="367" class="label" >Normalize 100 nodes</text><rect x="330" y="348" width="187.03" height="13" fill="#8a8a8a"/><text x="525.03" y="360" class="small" >63.4</text><rect x="330" y="369" width="285.855" height="13" fill="#111111"/><text x="623.855" y="381" class="small" >96.9</text><text x="40" y="438" class="label" >Shape + encode JSON</text><rect x="330" y="419" width="347.805" height="13" fill="#8a8a8a"/><text x="685.8050000000001" y="431" class="small" >117.9</text><rect x="330" y="440" width="462.55999999999995" height="13" fill="#111111"/><text x="800.56" y="452" class="small" >156.8</text>
<text x="625" y="531" class="small" text-anchor="middle">Microseconds · linear scale · lower is less time</text>
<path d="M 40 550 L 1060 550" stroke="#d4d4d4" /><text x="40" y="576" class="small" >Independent stage operations, not an end-to-end call. One run; no confidence interval.</text>
<text x="40" y="596" class="small" >Figma, network, and model inference: not measured. Do not compare directly with desktop latency.</text>


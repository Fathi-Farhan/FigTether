<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="555" viewBox="0 0 1100 555" role="img" aria-labelledby="title desc">
<title id="title">Offline Rust stage diagnostic</title>
<desc id="desc">One diagnostic run at commit e9e23b0, 2000 samples per stage. Bars show p50 and p95 in microseconds, on a linear zero-based axis. Figma work, network latency, and model inference are not measured.</desc>
<style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#172b3a;font-size:16px}.small{font-size:13px;fill:#526575}.title{font-size:26px;font-weight:700}.label{font-size:17px;font-weight:600}</style>
<rect width="1100" height="555" rx="18" fill="#f5f8fb"/>

<text x="32" y="45" class="title">Where the offline core spends time</text>
<text x="32" y="76" class="small">2,000 samples / stage | Windows x64 | AMD Ryzen 5 4500 | e9e23b0</text>
<rect x="790" y="29" width="14" height="14" rx="2" fill="#207f8c"/><text x="812" y="41" class="small">p50</text>
<rect x="880" y="29" width="14" height="14" rx="2" fill="#6475ce"/><text x="902" y="41" class="small">p95</text>

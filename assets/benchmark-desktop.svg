<title id="title">Real Figma. Measured latency.</title><desc id="desc">Historical Figma Desktop 126.10.10 measurements. Independent zero-based millisecond axes. Cached-root p50/p95/p99: 0.65/0.90/1.08 ms, 20,010 requests including 20,000 confirmed cache hits and 10 fresh fallbacks. Fresh 72-node read: 113.53/127.75/169.79 ms, 1,000 requests. PNG render/export metadata: 566.82/613.76/640.86 ms, 100 requests. Client download not validated. Model cost unmeasured. This historical run also recorded get_selection timeout and inspect_design protocol mismatch.</desc>

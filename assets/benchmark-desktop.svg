<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
<title id="title">FigTether desktop request latency</title><desc id="desc">Real Figma Desktop measurements on one Windows machine. The cached-root lane includes 20,000 confirmed hits and 10 fresh fallbacks. Fresh reads return 72 nodes. PNG render/export metadata uses a 1440 by 1640 fixture; client download delivery was not validated. Independent linear axes start at zero. Model cost and tokens were not measured. Known get_selection timeout and inspect_design protocol mismatch remain.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc"><title id="title">Editable website diagnostic, 21 October 2026</title><desc id="desc">Three workload panels with independent zero-based axes. Fresh read p50 108.29 ms, listing p50 62.47 ms, export metadata p50 1558.44 ms. Two rich reads timed out; pagination repeated a page. Model cost unmeasured.</desc><rect width="1000" height="720" fill="#fff"/><g font-family="Arial, sans-serif" fill="#17251e"><text x="40" y="45" font-size="13">FIGTETHER / RECORDED DESKTOP DIAGNOSTIC</text><text x="40" y="87" font-size="30">123 editable nodes. Six approved writes.</text><text x="40" y="117" font-size="15">Windows · Figma 126.10.11 · Debug build · Independent axes · Dark bar: p50; light: p95</text><text x="40" y="160" font-size="19" font-weight="bold">Fresh 38-node read</text><text x="760" y="160" font-size="15">n = 10, 10/10 passed</text><line x1="40" y1="225" x2="650" y2="225" stroke="#c8cec9"/><rect x="40" y="175" width="490.5851800000002" height="22" fill="#bfd1c4"/><rect x="40" y="175" width="440.36957333333385" height="22" fill="#24513f"/><text x="40" y="251" font-size="15">p50 108.29 ms · p95 120.64 ms</text><text x="650" y="247" text-anchor="end" font-size="13" fill="#555">0-150 ms</text><text x="40" y="295" font-size="19" font-weight="bold">First page, 50 nodes</text><text x="760" y="295" font-size="15">n = 10, 10/10 passed</text><line x1="40" y1="360" x2="650" y2="360" stroke="#c8cec9"/><rect x="40" y="310" width="465.0139800000002" height="22" fill="#bfd1c4"/><rect x="40" y="310" width="254.03002666666677" height="22" fill="#24513f"/><text x="40" y="386" font-size="15">p50 62.47 ms · p95 114.35 ms</text><text x="650" y="382" text-anchor="end" font-size="13" fill="#555">0-150 ms</text><text x="40" y="430" font-size="19" font-weight="bold">1440 x 4440 PNG metadata</text><text x="760" y="430" font-size="15">n = 3, 3/3 passed</text><line x1="40" y1="495" x2="650" y2="495" stroke="#c8cec9"/><rect x="40" y="445" width="482.39901050000003" height="22" fill="#bfd1c4"/><rect x="40" y="445" width="475.3247489999999" height="22" fill="#24513f"/><text x="40" y="521" font-size="15">p50 1558.44 ms · p95 1581.64 ms</text><text x="650" y="517" text-anchor="end" font-size="13" fill="#555">0-2000 ms</text><line x1="40" y1="580" x2="960" y2="580" stroke="#c8cec9"/><text x="40" y="616" font-size="17" fill="#923d24">Open defects: two rich reads timed out at 20 s; cursor repeated a page.</text><text x="40" y="649" font-size="15">All five sections verified separately. Static design; no responsive or interaction test.</text><text x="40" y="680" font-size="15">Model cost/tokens: unmeasured. PNG bar measures export metadata, not client download.</text></g></svg>

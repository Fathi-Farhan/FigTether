<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
<title id="title">FigTether system architecture</title><desc id="desc">The coding agent calls FigTether&apos;s own MCP server over stdio. The Rust adapter reaches the daemon through an authenticated loopback WebSocket; the daemon reaches the Figma plugin through another local WebSocket. The sandbox reads and mutates native nodes. Writes require a user-granted root, a separate write grant, preview and approval for the exact plan.</desc>
<style>text{fill:#111111;font-family:Arial,Helvetica,sans-serif;font-size:16px}.heading{font-family:Gelasio,Georgia,serif;font-size:36px;font-weight:400;letter-spacing:-.6px}.subhead{font-family:Gelasio,Georgia,serif;font-size:24px}.label{font-size:18px;font-weight:600}.body{font-size:16px}.small{font-size:14px;fill:#525252}.meta{font-family:"Ubuntu Mono",Consolas,monospace;font-size:13px;letter-spacing:.5px}.code{font-family:"Ubuntu Mono",Consolas,monospace;font-size:19px}.value{font-family:Consolas,monospace;font-size:16px}.warn{fill:#9a4b00;font-size:14px}</style>
<rect width="1100" height="560" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M 0 0 L 7 3.5 L 0 7" fill="#111111"/></marker></defs>

<text x="40" y="40" class="meta" >01 / FIGTETHER - SYSTEM</text><path d="M 40 58 L 1060 58" stroke="#d4d4d4" /><text x="40" y="106" class="heading" >Read, create, and edit in Figma.</text><text x="40" y="138" class="small" >One local bridge. Native nodes. Explicit access and approval.</text>
<rect x="40" y="198" width="210" height="124" fill="#ffffff" stroke="#111111"/><text x="56" y="232" class="label" >Coding agent</text><text x="56" y="267" class="small" >Your MCP client</text><text x="56" y="299" class="small" >Reads + design plans</text>
<rect x="310" y="198" width="210" height="124" fill="#ffffff" stroke="#111111"/><text x="326" y="232" class="label" >Rust adapter</text><text x="326" y="267" class="small" >figtether mcp --stdio</text><text x="326" y="299" class="small" >Typed tool requests</text>
<rect x="580" y="198" width="210" height="124" fill="#ffffff" stroke="#111111"/><text x="596" y="232" class="label" >Local daemon</text><text x="596" y="267" class="small" >Scope · queue · cache</text><text x="596" y="299" class="small" >127.0.0.1:38947</text>
<rect x="850" y="198" width="210" height="124" fill="#ffffff" stroke="#111111"/><text x="866" y="232" class="label" >Figma plugin</text><text x="866" y="267" class="small" >UI ↔ sandbox</text><text x="866" y="299" class="small" >Native Plugin API</text>
<text x="280" y="181" class="meta" text-anchor="middle">stdio</text>
<text x="550" y="181" class="meta" text-anchor="middle">loopback WS</text>
<text x="820" y="181" class="meta" text-anchor="middle">local WS</text>
<path d="M 256 260 H 301" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 526 260 H 571" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 796 260 H 841" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 955 330 V 359 H 145 V 331" stroke="#111111" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="330" y="347" width="440" height="26" fill="white"/>
<text x="550" y="365" class="small" text-anchor="middle">Node data, asset metadata, and write results</text>
<path d="M 40 399 L 1060 399" stroke="#d4d4d4" />
<text x="40" y="433" class="meta" >WRITE PROTOCOL</text>
<text x="40" y="470" class="code" >preview_write</text><path d="M 222 464 H 294" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="310" y="470" class="label" >User approval</text><path d="M 480 464 H 564" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="580" y="470" class="code" >get_write_approval</text><path d="M 797 464 H 834" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="850" y="470" class="code" >apply_write</text>
<text x="40" y="512" class="small" >Requires a granted root + write permission. Rust checks the exact plan before the plugin mutates the document.</text>
<text x="40" y="540" class="small" >The agent chooses the design; the plugin executes supported operations. The client controls model inference.</text>

</svg>

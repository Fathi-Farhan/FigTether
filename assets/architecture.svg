<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1170" viewBox="0 0 800 1170" role="img" aria-labelledby="title desc">
<title id="title">How FigTether connects AI agents to Figma</title><desc id="desc">A coding agent calls the Rust MCP adapter over stdio. The adapter and daemon use an authenticated loopback WebSocket; the daemon connects to the Figma plugin over another local WebSocket. The manifest fixes the shared port. Native writes require a shared root, Allow editing, preview, exact-plan approval, then apply. Auto is optional and user-enabled for eligible plans.</desc>
<style>text{fill:#153f2e;font-family:Arial,Helvetica,sans-serif;font-size:24px}.heading{font-size:40px;font-weight:800;letter-spacing:-1px}.label{font-size:28px;font-weight:700}.body{font-size:24px}.small{font-size:22px}.meta{font-size:20px;font-weight:700;letter-spacing:1px}.code{font-family:Consolas,monospace;font-size:26px;font-weight:700}.value{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums}.tick{font-size:20px}.step{font-size:26px;font-weight:800}</style>
<rect width="800" height="1170" fill="#f7f6ee"/>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M 0 0 L 7 3.5 L 0 7" fill="#153f2e"/></marker></defs>
<text x="40" y="48" class="meta" >FIGTETHER / HOW IT WORKS</text><text x="40" y="104" class="heading" >One bridge. Native designs.</text><text x="40" y="144" class="body" >Your agent proposes. Figma creates the real nodes.</text><rect x="50" y="192" width="700" height="108" rx="8" fill="#f7f6ee" stroke="#153f2e" stroke-width="2"/><text x="74" y="232" class="label" >Coding agent</text><text x="74" y="270" class="small" >Your MCP client</text><path d="M 400 307 V 337" fill="none" stroke="#153f2e" stroke-width="3" marker-end="url(#arrow)"/><text x="432" y="329" class="small" >stdio</text>
<rect x="50" y="348" width="700" height="108" rx="8" fill="#f7f6ee" stroke="#153f2e" stroke-width="2"/><text x="74" y="388" class="label" >Rust MCP adapter</text><text x="74" y="426" class="small" >figtether mcp --stdio</text><path d="M 400 463 V 493" fill="none" stroke="#153f2e" stroke-width="3" marker-end="url(#arrow)"/><text x="432" y="485" class="small" >Local WebSocket</text>
<rect x="50" y="504" width="700" height="108" rx="8" fill="#d7f3ac" stroke="#153f2e" stroke-width="2"/><text x="74" y="544" class="label" >Local daemon</text><text x="74" y="582" class="small" >Scope, approval, queue, cache</text><path d="M 400 619 V 649" fill="none" stroke="#153f2e" stroke-width="3" marker-end="url(#arrow)"/><text x="432" y="641" class="small" >Local WebSocket</text>
<rect x="50" y="660" width="700" height="108" rx="0" fill="#f7f6ee" stroke="#153f2e" stroke-width="2"/><text x="74" y="700" class="label" >Figma plugin</text><text x="74" y="738" class="small" >Reads and edits native nodes</text><rect x="44" y="654" width="12" height="12" fill="#d7f3ac" stroke="#153f2e" stroke-width="2"/><rect x="744" y="654" width="12" height="12" fill="#d7f3ac" stroke="#153f2e" stroke-width="2"/><rect x="44" y="762" width="12" height="12" fill="#d7f3ac" stroke="#153f2e" stroke-width="2"/><rect x="744" y="762" width="12" height="12" fill="#d7f3ac" stroke="#153f2e" stroke-width="2"/>
<text x="40" y="824" class="small" >Local WebSockets use the port in your manifest.</text>
<text x="40" y="856" class="small" >The daemon validates scope before editor work.</text>
<path d="M 40 882 L 760 882" fill="none" stroke="#748375" /><text x="40" y="928" class="label" >Every edit has a plan.</text>
<text x="40" y="970" class="small" >1. preview_write - inspect the proposed changes.</text>
<text x="40" y="1006" class="small" >2. get_write_approval - check the exact plan.</text>
<text x="40" y="1042" class="small" >3. apply_write - create or edit native nodes.</text>
<text x="40" y="1102" class="small" >Share a frame and enable Allow editing first.</text>
<text x="40" y="1134" class="small" >Review each plan, or enable Auto for eligible plans.</text>
</svg>

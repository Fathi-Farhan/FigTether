<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="320" viewBox="0 0 1100 320" role="img" aria-labelledby="title desc">
<title id="title">FigTether: local acquisition, explicit access</title>
<desc id="desc">An MCP client reaches a Rust stdio adapter, loopback daemon, plugin UI, and Figma sandbox. The user grants selected roots. Only the sandbox reads the document; the AI client decides where results go.</desc>
<style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#172b3a;font-size:16px}.small{font-size:13px;fill:#526575}.title{font-size:26px;font-weight:700}.label{font-size:17px;font-weight:600}</style>
<rect width="1100" height="320" rx="18" fill="#f5f8fb"/>

<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M 0 0 L 6 3 L 0 6" fill="#207f8c"/></marker></defs>
<text x="32" y="48" class="title">A local bridge, not a cloud relay</text>
<text x="32" y="79" class="small">Read requests travel right. Design context returns left.</text>
<rect x="664" y="101" width="420" height="146" rx="16" fill="#e5f1ee"/>
<rect x="32" y="122" width="172" height="104" rx="12" fill="white" stroke="#bacbd9"/>
<text x="48" y="158" class="label">MCP client</text>
<text x="48" y="186" class="small">Your coding agent</text>
<rect x="248" y="122" width="172" height="104" rx="12" fill="white" stroke="#bacbd9"/>
<text x="264" y="158" class="label">Rust adapter</text>
<text x="264" y="186" class="small">MCP over stdio</text>
<rect x="464" y="122" width="172" height="104" rx="12" fill="white" stroke="#bacbd9"/>
<text x="480" y="158" class="label">Rust daemon</text>
<text x="480" y="186" class="small">Queue / cache / scope</text>
<rect x="680" y="122" width="172" height="104" rx="12" fill="white" stroke="#bacbd9"/>
<text x="696" y="158" class="label">Plugin UI</text>
<text x="696" y="186" class="small">Local WebSocket</text>
<rect x="896" y="122" width="172" height="104" rx="12" fill="white" stroke="#bacbd9"/>
<text x="912" y="158" class="label">Sandbox</text>
<text x="912" y="186" class="small">Figma Plugin API</text>
<path d="M 210 174 H 234" stroke="#207f8c" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 426 174 H 450" stroke="#207f8c" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 642 174 H 666" stroke="#207f8c" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 858 174 H 882" stroke="#207f8c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="700" y="270" class="small">Figma Desktop: user-granted roots</text>
<text x="32" y="293" class="small">Local acquisition does not imply local inference: your MCP client controls model access.</text>
</svg>
